<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KI Connect — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07111e;--surface:#0d1b2a;--surface2:#112236;
      --line:#1c3048;--line2:#254060;
      --accent:#19c6be;--accent-h:#12a8a1;--accent-lo:rgba(25,198,190,.1);--accent-br:rgba(25,198,190,.28);
      --gold:#e8a838;--gold-lo:rgba(232,168,56,.1);
      --green:#37c27a;--green-lo:rgba(55,194,122,.1);
      --red:#e05252;--red-lo:rgba(224,82,82,.1);
      --purple:#9d6eea;--purple-lo:rgba(157,110,234,.1);
      --text:#dde8f4;--text2:#7a94aa;--muted:#3a556a;
      --sidebar:220px;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}

    /* ── Layout ── */
    .layout{display:flex;min-height:100vh}

    /* ── Sidebar ── */
    .sidebar{
      width:var(--sidebar);flex-shrink:0;
      background:var(--surface);
      border-right:1px solid var(--line);
      display:flex;flex-direction:column;
      position:fixed;top:0;left:0;bottom:0;
      z-index:100;overflow-y:auto;
    }

    .sidebar__logo{
      padding:20px 18px 16px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:10px;
    }

    .logo-icon{
      width:32px;height:32px;border-radius:9px;
      background:var(--accent-lo);border:1px solid var(--accent-br);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .logo-icon svg{width:15px;height:15px}
    .logo-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:800}
    .logo-name span{color:var(--accent)}

    .sidebar__nav{flex:1;padding:12px 10px}
    .nav-section{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:0 8px;margin:14px 0 5px}
    .nav-section:first-child{margin-top:0}

    .nav-item{
      display:flex;align-items:center;gap:9px;
      padding:9px 10px;border-radius:8px;
      color:var(--text2);cursor:pointer;
      transition:all .15s;margin-bottom:1px;
      border:1px solid transparent;
      background:none;width:100%;
      font-family:'Inter',sans-serif;font-size:13px;text-align:left;
    }
    .nav-item:hover{background:var(--surface2);color:var(--text)}
    .nav-item.active{background:var(--accent-lo);color:var(--accent);border-color:var(--accent-br)}
    .nav-item svg{width:15px;height:15px;flex-shrink:0}

    .sidebar__footer{
      padding:14px;border-top:1px solid var(--line);
      display:flex;align-items:center;gap:10px;
    }
    .user-av{
      width:32px;height:32px;border-radius:50%;
      background:var(--accent-lo);border:1px solid var(--accent-br);
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:600;color:var(--accent);flex-shrink:0;
    }
    .user-info{flex:1;min-width:0}
    .user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-role{font-size:11px;color:var(--text2);text-transform:capitalize}
    .logout-btn{
      background:none;border:none;color:var(--muted);cursor:pointer;
      padding:5px;border-radius:6px;display:flex;transition:color .15s;
    }
    .logout-btn:hover{color:var(--red)}
    .logout-btn svg{width:15px;height:15px}

    /* ── Main ── */
    .main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-height:100vh}

    .topbar{
      background:var(--surface);border-bottom:1px solid var(--line);
      padding:0 24px;height:56px;
      display:flex;align-items:center;gap:12px;
      position:sticky;top:0;z-index:50;
    }
    .topbar__title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;flex:1}

    .content{padding:24px;flex:1}

    .section{display:none}
    .section.active{display:block}

    /* ── Stat cards ── */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}

    .stat{
      background:var(--surface);border:1px solid var(--line);
      border-radius:12px;padding:18px;
    }
    .stat__icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
    .stat__icon svg{width:15px;height:15px}
    .stat__icon.c{background:var(--accent-lo);color:var(--accent)}
    .stat__icon.g{background:var(--green-lo);color:var(--green)}
    .stat__icon.p{background:var(--purple-lo);color:var(--purple)}
    .stat__val{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1;margin-bottom:3px}
    .stat__label{font-size:12px;color:var(--text2)}

    /* ── Cards ── */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
    .card__head{padding:15px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .card__title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
    .card__body{padding:16px 18px}

    /* ── Session rows ── */
    .session-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
    .session-item:last-child{border-bottom:none;padding-bottom:0}
    .session-item:first-child{padding-top:0}

    .session-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .session-dot.live{background:var(--red);animation:pulse 1.5s infinite}
    .session-dot.upcoming{background:var(--accent)}
    .session-dot.ended{background:var(--muted)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    .session-info{flex:1;min-width:0}
    .session-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
    .session-meta{font-size:12px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap}

    .status-tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px}
    .status-tag.live{background:var(--red-lo);color:var(--red);border:1px solid rgba(224,82,82,.3)}
    .status-tag.upcoming{background:var(--accent-lo);color:var(--accent);border:1px solid var(--accent-br)}
    .status-tag.ended{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

    /* ── Buttons ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
    .btn--primary{background:var(--accent);color:#06111d}
    .btn--primary:hover{background:var(--accent-h)}
    .btn--outline{background:none;color:var(--text2);border:1px solid var(--line)}
    .btn--outline:hover{border-color:var(--line2);color:var(--text)}
    .btn svg{width:13px;height:13px}

    /* ── Empty state ── */
    .empty{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty svg{width:36px;height:36px;margin:0 auto 12px;display:block;opacity:.3}
    .empty p{font-size:13px;color:var(--text2)}
    .empty small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}

    /* ── Attendance table ── */
    .att-table{width:100%;border-collapse:collapse}
    .att-table th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);background:var(--surface2)}
    .att-table td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text2)}
    .att-table tr:last-child td{border-bottom:none}
    .att-table td:first-child{color:var(--text);font-weight:500}

    .pill{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;padding:2px 8px;border-radius:20px}
    .pill.present{background:var(--green-lo);color:var(--green)}
    .pill.late{background:var(--gold-lo);color:var(--gold)}
    .pill.absent{background:var(--red-lo);color:var(--red)}

    /* ── Grid ── */
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

    /* ── Toast ── */
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--line2);border-radius:50px;padding:9px 20px;font-size:13px;color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;z-index:999;white-space:nowrap}
    .toast--show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast .toast__msg{}

    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

    @media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
    @media(max-width:680px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar__logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#19c6be"/><circle cx="12" cy="12" r="8" stroke="#19c6be" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/></svg>
      </div>
      <div class="logo-name">KI <span>Connect</span></div>
    </div>

    <nav class="sidebar__nav">
      <div class="nav-section">Main</div>
      <button class="nav-item active" onclick="showSection('overview', this)">
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
        Overview
      </button>
      <button class="nav-item" onclick="showSection('sessions', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
        Sessions
      </button>
      <button class="nav-item" onclick="showSection('recordings', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="10" height="10" rx="1.5"/><circle cx="13" cy="6" r="2"/><circle cx="13" cy="10" r="2"/></svg>
        Recordings
      </button>
      <div class="nav-section">Progress</div>
      <button class="nav-item" onclick="showSection('attendance', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 3L6 10 3 7"/><circle cx="8" cy="8" r="7"/></svg>
        Attendance
      </button>
    </nav>

    <div class="sidebar__footer">
      <div class="user-av" id="userAv">?</div>
      <div class="user-info">
        <div class="user-name" id="userName">—</div>
        <div class="user-role">Student</div>
      </div>
      <button class="logout-btn" onclick="logout()" title="Sign out">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3h3a1 1 0 011 1v8a1 1 0 01-1 1h-3M7 11l3-3-3-3M10 8H2"/></svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar__title" id="topbarTitle">Overview</div>
    </header>

    <div class="content">

      <!-- OVERVIEW -->
      <div class="section active" id="section-overview">
        <div class="stats">
          <div class="stat">
            <div class="stat__icon c"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg></div>
            <div class="stat__val" id="statSessions">—</div>
            <div class="stat__label">Sessions attended</div>
          </div>
          <div class="stat">
            <div class="stat__icon g"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 3L6 10 3 7"/></svg></div>
            <div class="stat__val" id="statAtt">—</div>
            <div class="stat__label">Attendance rate</div>
          </div>
          <div class="stat">
            <div class="stat__icon p"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="10" height="10" rx="1.5"/><circle cx="13" cy="6" r="2"/></svg></div>
            <div class="stat__val" id="statRecs">—</div>
            <div class="stat__label">Recordings available</div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card__head">
              <div class="card__title">Upcoming &amp; Live</div>
              <button class="btn btn--outline" onclick="showSection('sessions', document.querySelector('.nav-item:nth-child(2)'))">All sessions</button>
            </div>
            <div class="card__body" id="overviewSessions">
              <div class="empty"><p>Loading…</p></div>
            </div>
          </div>

          <div class="card">
            <div class="card__head"><div class="card__title">Recent attendance</div></div>
            <div class="card__body" id="overviewAtt">
              <div class="empty"><p>Loading…</p></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ALL SESSIONS -->
      <div class="section" id="section-sessions">
        <div class="card">
          <div class="card__head"><div class="card__title">All sessions</div></div>
          <div class="card__body" id="allSessions">
            <div class="empty"><p>Loading…</p></div>
          </div>
        </div>
      </div>

      <!-- RECORDINGS -->
      <div class="section" id="section-recordings">
        <div class="card">
          <div class="card__head"><div class="card__title">Recorded sessions</div></div>
          <div class="card__body" id="allRecordings">
            <div class="empty"><p>Loading…</p></div>
          </div>
        </div>
      </div>

      <!-- ATTENDANCE -->
      <div class="section" id="section-attendance">
        <div class="card">
          <div class="card__head"><div class="card__title">Your attendance log</div></div>
          <div style="overflow-x:auto">
            <table class="att-table">
              <thead><tr><th>Session</th><th>Date</th><th>Status</th></tr></thead>
              <tbody id="attTable"><tr><td colspan="3"><div class="empty" style="padding:30px"><p>Loading…</p></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="toast__msg"></span></div>

<script>
let me = null; // { user, profile }
let sessions = [];
let attendance = [];

window.addEventListener('DOMContentLoaded', async () => {
  me = await requireAuth();
  if (!me) return;

  if (me.profile.role !== 'student') {
    goHome(me.profile.role); return;
  }

  // Render profile
  const name = me.profile.full_name || me.user.email.split('@')[0];
  document.getElementById('userName').textContent = name;
  document.getElementById('userAv').textContent   = initials(name);

  await Promise.all([loadSessions(), loadAttendance(), loadRecordings()]);
});

function showSection(id, navEl) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  if (navEl) navEl.classList.add('active');
  const titles = { overview:'Overview', sessions:'Sessions', recordings:'Recordings', attendance:'Attendance' };
  document.getElementById('topbarTitle').textContent = titles[id] || id;
}

/* ── Load data ─────────────────────────────────────────── */
async function loadSessions() {
  const { data, error } = await db
    .from('kic_sessions')
    .select('*, teacher:teacher_id(full_name)')
    .order('scheduled_at', { ascending: true });

  if (error) { toast('Could not load sessions.', 'err'); return; }
  sessions = data || [];

  renderOverviewSessions();
  renderAllSessions();
  updateStats();
}

async function loadAttendance() {
  const { data, error } = await db
    .from('kic_attendance')
    .select('*, session:session_id(title, scheduled_at)')
    .eq('user_id', me.user.id)
    .order('joined_at', { ascending: false });

  if (error) return;
  attendance = data || [];

  renderOverviewAtt();
  renderAttTable();
  updateStats();
}

async function loadRecordings() {
  const { data } = await db
    .from('kic_recordings')
    .select('*')
    .order('created_at', { ascending: false });

  renderRecordings(data || []);
  document.getElementById('statRecs').textContent = (data || []).length;
}

/* ── Render ─────────────────────────────────────────────── */
function updateStats() {
  const attended = attendance.filter(a => a.status === 'present' || a.status === 'late').length;
  document.getElementById('statSessions').textContent = attended;

  if (attendance.length > 0) {
    const pct = Math.round((attended / attendance.length) * 100);
    document.getElementById('statAtt').textContent = pct + '%';
  } else {
    document.getElementById('statAtt').textContent = '—';
  }
}

function sessionItemHTML(s) {
  const teacher = s.teacher?.full_name || 'TBA';
  const status  = s.status || 'upcoming';
  const timeStr = s.scheduled_at ? fmtDateTime(s.scheduled_at) : 'TBA';

  const joinBtn = (status === 'live')
    ? `<button class="btn btn--primary" onclick="window.location.href='session.html?id=${s.id}'">Join</button>`
    : status === 'upcoming'
    ? `<button class="btn btn--outline" disabled style="opacity:.4;cursor:default">Scheduled</button>`
    : `<span class="status-tag ended">Ended</span>`;

  return `
    <div class="session-item">
      <div class="session-dot ${status}"></div>
      <div class="session-info">
        <div class="session-title">${s.title}</div>
        <div class="session-meta">
          <span>${teacher}</span>
          <span>${timeStr}</span>
          <span>${s.duration_minutes || 60} min</span>
        </div>
      </div>
      ${joinBtn}
    </div>`;
}

function renderOverviewSessions() {
  const el = document.getElementById('overviewSessions');
  const active = sessions.filter(s => s.status === 'live' || s.status === 'upcoming').slice(0, 4);
  el.innerHTML = active.length
    ? active.map(sessionItemHTML).join('')
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><p>No upcoming sessions right now.</p><small>Check back later or contact your teacher.</small></div>`;
}

function renderAllSessions() {
  const el = document.getElementById('allSessions');
  el.innerHTML = sessions.length
    ? sessions.map(sessionItemHTML).join('')
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="9"/></svg><p>No sessions yet.</p></div>`;
}

function renderOverviewAtt() {
  const el = document.getElementById('overviewAtt');
  const recent = attendance.slice(0, 5);
  el.innerHTML = recent.length
    ? recent.map(a => `
        <div class="session-item">
          <div class="session-info">
            <div class="session-title">${a.session?.title || 'Session'}</div>
            <div class="session-meta"><span>${fmtDate(a.session?.scheduled_at || a.joined_at)}</span></div>
          </div>
          <span class="pill ${a.status || 'present'}">${a.status || 'present'}</span>
        </div>`).join('')
    : `<div class="empty"><p>No attendance records yet.</p></div>`;
}

function renderAttTable() {
  const tbody = document.getElementById('attTable');
  tbody.innerHTML = attendance.length
    ? attendance.map(a => `
        <tr>
          <td>${a.session?.title || '—'}</td>
          <td>${fmtDate(a.session?.scheduled_at || a.joined_at)}</td>
          <td><span class="pill ${a.status || 'present'}">${a.status || 'present'}</span></td>
        </tr>`).join('')
    : `<tr><td colspan="3"><div class="empty" style="padding:30px"><p>No attendance records yet.</p></div></td></tr>`;
}

function renderRecordings(recs) {
  const el = document.getElementById('allRecordings');
  el.innerHTML = recs.length
    ? recs.map(r => `
        <div class="session-item">
          <div class="session-info">
            <div class="session-title">${r.title || 'Untitled recording'}</div>
            <div class="session-meta"><span>${fmtDate(r.created_at)}</span>${r.duration_seconds ? `<span>${Math.round(r.duration_seconds/60)} min</span>` : ''}</div>
          </div>
        </div>`).join('')
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M16 9l6-4v14l-6-4"/></svg><p>No recordings available yet.</p><small>Recorded sessions will appear here after your teacher uploads them.</small></div>`;
}
</script>
</body>
</html>
