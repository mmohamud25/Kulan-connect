<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KI Connect — Live Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080d14;
      --surface: #0f1923;
      --border: #1a2535;
      --cyan: #00d4c8;
      --cyan-dim: rgba(0, 212, 200, 0.12);
      --cyan-glow: rgba(0, 212, 200, 0.25);
      --text: #e8edf5;
      --muted: #5a6a80;
      --error: #ff5c5c;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,200,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,200,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(0,212,200,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Logo area */
    .brand {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown 0.6s ease both;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--cyan-dim);
      border: 1px solid rgba(0,212,200,0.3);
      margin-bottom: 16px;
      position: relative;
    }

    .brand-mark svg {
      width: 28px;
      height: 28px;
    }

    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 20px;
      border: 1px solid rgba(0,212,200,0.2);
      animation: pulse 2.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.1; transform: scale(1.06); }
    }

    .brand h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .brand h1 span {
      color: var(--cyan);
    }

    .brand p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--cyan-dim);
      color: var(--cyan);
      border: 1px solid rgba(0,212,200,0.25);
    }

    /* Forms */
    .form { display: none; flex-direction: column; gap: 16px; }
    .form.active { display: flex; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: rgba(0,212,200,0.5);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }

    .field input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--cyan);
      color: #080d14;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 4px;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,212,200,0.25);
    }

    .btn:active { transform: translateY(0); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(8,13,20,0.3);
      border-top-color: #080d14;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert */
    .alert {
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 13px;
      display: none;
    }

    .alert.error {
      display: block;
      background: rgba(255,92,92,0.1);
      border: 1px solid rgba(255,92,92,0.25);
      color: #ff8080;
    }

    .alert.success {
      display: block;
      background: var(--cyan-dim);
      border: 1px solid rgba(0,212,200,0.25);
      color: var(--cyan);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin: 4px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Footer */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      animation: fadeUp 0.6s 0.2s ease both;
    }

    .footer a {
      color: var(--cyan);
      text-decoration: none;
    }

    /* Badges */
    .badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      animation: blink 2s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="brand">
      <div class="brand-mark">
        <div class="pulse-ring"></div>
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="5" fill="#00d4c8"/>
          <circle cx="14" cy="14" r="9" stroke="#00d4c8" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="14" cy="4" r="2" fill="#00d4c8" opacity="0.6"/>
          <circle cx="24" cy="14" r="2" fill="#00d4c8" opacity="0.6"/>
          <circle cx="4" cy="14" r="2" fill="#00d4c8" opacity="0.6"/>
        </svg>
      </div>
      <h1>KI <span>Connect</span></h1>
      <p>Live Classroom by Kulan Institute</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Sign In</button>
        <button class="tab" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Login Form -->
      <div class="form active" id="loginForm">
        <div id="loginAlert" class="alert"></div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn" id="loginBtn" onclick="handleLogin()">
          <span class="btn-text">Sign In</span>
          <div class="spinner"></div>
        </button>
      </div>

      <!-- Signup Form -->
      <div class="form" id="signupForm">
        <div id="signupAlert" class="alert"></div>
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Your full name"/>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Min 8 characters" autocomplete="new-password"/>
        </div>
        <button class="btn" id="signupBtn" onclick="handleSignup()">
          <span class="btn-text">Create Account</span>
          <div class="spinner"></div>
        </button>
      </div>
    </div>

    <div class="footer">
      <div class="badges">
        <div class="badge"><div class="badge-dot"></div> Live Sessions</div>
        <div class="badge"><div class="badge-dot"></div> Real-time Chat</div>
        <div class="badge"><div class="badge-dot"></div> Attendance Tracking</div>
      </div>
      <p style="margin-top:16px;">Part of <a href="https://kulaninstitute.org" target="_blank">kulaninstitute.org</a></p>
    </div>

  </div>

  <script src="js/supabase.js"></script>
  <script>
    // Tab switcher
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
      });
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('signupForm').classList.toggle('active', tab === 'signup');
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.classList.toggle('loading', loading);
      btn.disabled = loading;
    }

    function showAlert(id, message, type = 'error') {
      const el = document.getElementById(id);
      el.textContent = message;
      el.className = `alert ${type}`;
    }

    function clearAlert(id) {
      const el = document.getElementById(id);
      el.className = 'alert';
    }

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        redirectByRole(user);
      }
    });

    async function redirectByRole(user) {
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (profile?.role === 'teacher' || profile?.role === 'admin') {
        window.location.href = 'teacher.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }

    async function handleLogin() {
      clearAlert('loginAlert');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showAlert('loginAlert', 'Please fill in all fields.');
        return;
      }

      setLoading('loginBtn', true);

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        showAlert('loginAlert', error.message);
        setLoading('loginBtn', false);
        return;
      }

      redirectByRole(data.user);
    }

    async function handleSignup() {
      clearAlert('signupAlert');
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!name || !email || !password) {
        showAlert('signupAlert', 'Please fill in all fields.');
        return;
      }

      if (password.length < 8) {
        showAlert('signupAlert', 'Password must be at least 8 characters.');
        return;
      }

      setLoading('signupBtn', true);

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { full_name: name } }
      });

      if (error) {
        showAlert('signupAlert', error.message);
        setLoading('signupBtn', false);
        return;
      }

      showAlert('signupAlert', 'Account created! Check your email to confirm.', 'success');
      setLoading('signupBtn', false);
    }

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const loginActive = document.getElementById('loginForm').classList.contains('active');
        if (loginActive) handleLogin();
        else handleSignup();
      }
    });
  </script>
</body>
</html>
