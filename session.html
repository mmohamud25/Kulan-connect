<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KI Connect — Live Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07111e;--surface:#0d1b2a;--surface2:#112236;
      --line:#1c3048;--line2:#254060;
      --accent:#19c6be;--accent-lo:rgba(25,198,190,.1);--accent-br:rgba(25,198,190,.28);
      --gold:#e8a838;--gold-lo:rgba(232,168,56,.1);
      --green:#37c27a;--green-lo:rgba(55,194,122,.1);
      --red:#e05252;--red-lo:rgba(224,82,82,.1);--red-br:rgba(224,82,82,.3);
      --text:#dde8f4;--text2:#7a94aa;--muted:#3a556a;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;overflow:hidden}

    /* ── 3-zone layout ── */
    .layout{display:grid;grid-template-rows:52px 1fr 64px;grid-template-columns:1fr 300px;height:100vh;grid-template-areas:"bar bar" "stage panel" "ctrl ctrl"}

    /* ── Top bar ── */
    .topbar{grid-area:bar;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px}
    .session-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .live-pill{display:flex;align-items:center;gap:5px;background:var(--red-lo);border:1px solid var(--red-br);color:var(--red);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:20px}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .timer{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text2);letter-spacing:1px}
    .pcount{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:5px}
    .pcount svg{width:13px;height:13px}
    .end-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--red-br);background:var(--red-lo);color:var(--red);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
    .end-btn:hover{background:rgba(224,82,82,.18)}
    .end-btn svg{width:13px;height:13px}

    /* ── Stage ── */
    .stage{grid-area:stage;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #screenVid{width:100%;height:100%;object-fit:contain;display:none}
    #camVid{position:absolute;bottom:12px;right:12px;width:160px;height:100px;border-radius:9px;border:2px solid var(--accent);object-fit:cover;display:none}
    .stage-ph{text-align:center;color:var(--muted)}
    .stage-ph svg{width:52px;height:52px;margin:0 auto 14px;display:block;opacity:.2}
    .stage-ph h3{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--text2);margin-bottom:6px}
    .stage-ph p{font-size:13px}
    .rec-badge{position:absolute;top:14px;left:14px;display:none;align-items:center;gap:6px;background:rgba(224,82,82,.88);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px}
    .rec-badge.on{display:flex}
    .rec-dot2{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
    .hands-float{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px}
    .hand-chip{background:rgba(232,168,56,.88);backdrop-filter:blur(6px);color:#06111d;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;animation:slideIn .25s ease}
    @keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
    .reactions-float{position:absolute;bottom:80px;left:16px;display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none}
    .reaction{font-size:22px;animation:floatUp 2.4s ease forwards}
    @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(1.2)}}

    /* ── Side panel ── */
    .panel{grid-area:panel;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
    .panel-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
    .ptab{flex:1;padding:12px 4px;border:none;background:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border-bottom:2px solid transparent}
    .ptab svg{width:14px;height:14px}
    .ptab:hover{color:var(--text2)}
    .ptab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-badge{position:absolute;top:6px;right:8px;min-width:15px;height:15px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:50px;display:none;align-items:center;justify-content:center;padding:0 3px}
    .pane{display:none;flex:1;flex-direction:column;overflow:hidden}
    .pane.active{display:flex}

    /* Chat */
    .chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
    .chat-msg{display:flex;gap:8px}
    .msg-av{width:24px;height:24px;border-radius:50%;background:var(--accent-lo);border:1px solid var(--accent-br);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--accent);flex-shrink:0}
    .msg-av.teacher{background:var(--gold-lo);border-color:rgba(232,168,56,.3);color:var(--gold)}
    .msg-body{flex:1}
    .msg-head{display:flex;gap:6px;align-items:baseline;margin-bottom:2px}
    .msg-name{font-size:11px;font-weight:600;color:var(--accent)}
    .msg-name.teacher{color:var(--gold)}
    .msg-time{font-size:10px;color:var(--muted)}
    .msg-text{font-size:13px;color:var(--text2);line-height:1.5;word-break:break-word}
    .sys-msg{text-align:center;font-size:11px;color:var(--muted);padding:2px}
    .chat-compose{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;flex-shrink:0}
    .chat-input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;resize:none;height:38px;transition:border-color .18s}
    .chat-input:focus{border-color:var(--accent-br)}
    .chat-input::placeholder{color:var(--muted)}
    .chat-row{display:flex;align-items:center;gap:6px}
    .emoji-row{display:flex;gap:4px;flex:1}
    .emj{background:none;border:none;font-size:16px;cursor:pointer;padding:2px 3px;border-radius:5px;transition:background .12s}
    .emj:hover{background:var(--surface2)}
    .send-btn{width:32px;height:32px;border-radius:8px;border:none;background:var(--accent);color:#06111d;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s;flex-shrink:0}
    .send-btn:hover{opacity:.85}
    .send-btn svg{width:13px;height:13px}

    /* Participants */
    .parts-list{flex:1;overflow-y:auto;padding:10px}
    .part-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);margin-bottom:5px}
    .part-item.raised{border-color:rgba(232,168,56,.4);background:var(--gold-lo)}
    .part-av{width:26px;height:26px;border-radius:50%;background:var(--accent-lo);border:1px solid var(--accent-br);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--accent);flex-shrink:0}
    .part-av.teacher{background:var(--gold-lo);border-color:rgba(232,168,56,.3);color:var(--gold)}
    .part-name{flex:1;font-size:12px;font-weight:500}
    .part-role{font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 6px;border-radius:10px}
    .part-role.student{background:var(--accent-lo);color:var(--accent)}
    .part-role.teacher{background:var(--gold-lo);color:var(--gold)}

    /* Q&A */
    .qa-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
    .qa-item{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:11px}
    .qa-item.answered{border-color:rgba(55,194,122,.3);background:var(--green-lo)}
    .qa-asker{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:5px}
    .qa-q{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:7px}
    .qa-foot{display:flex;align-items:center;gap:6px}
    .qa-upvote{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;transition:color .15s;font-family:'Inter',sans-serif}
    .qa-upvote:hover{color:var(--text)}
    .qa-btn{padding:3px 9px;border-radius:6px;border:none;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
    .qa-btn.mark{background:var(--accent-lo);color:var(--accent);border:1px solid var(--accent-br)}
    .qa-btn.answered{background:var(--green-lo);color:var(--green);border:1px solid rgba(55,194,122,.3)}
    .qa-compose{padding:10px;border-top:1px solid var(--line);flex-shrink:0}
    .qa-compose input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .18s;margin-bottom:7px}
    .qa-compose input:focus{border-color:var(--accent-br)}
    .qa-compose input::placeholder{color:var(--muted)}
    .qa-submit{width:100%;padding:8px;border:1px solid var(--accent-br);border-radius:8px;background:var(--accent-lo);color:var(--accent);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
    .qa-submit:hover{background:rgba(25,198,190,.18)}

    /* Controls bar */
    .controls{grid-area:ctrl;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0 18px;gap:8px}
    .ctrl-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;min-width:58px}
    .ctrl-btn svg{width:17px;height:17px}
    .ctrl-btn:hover{border-color:var(--line2);color:var(--text)}
    .ctrl-btn.on{background:var(--accent-lo);border-color:var(--accent-br);color:var(--accent)}
    .ctrl-btn.danger{background:var(--red-lo);border-color:var(--red-br);color:var(--red)}
    .ctrl-sep{width:1px;height:28px;background:var(--line);margin:0 2px}
    .teacher-ctrl{display:none;align-items:center;gap:8px}
    .teacher-ctrl.visible{display:flex}

    /* Empty */
    .empty-sm{text-align:center;padding:28px 16px;color:var(--muted);font-size:12px}

    /* Toast */
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface2);border:1px solid var(--line2);border-radius:50px;padding:8px 18px;font-size:13px;color:var(--text);box-shadow:0 8px 28px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;z-index:999;white-space:nowrap}
    .toast--show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast .toast__msg{}

    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
  </style>
</head>
<body>
<div class="layout">

  <!-- Top bar -->
  <header class="topbar">
    <div class="session-name" id="sessionName">Loading…</div>
    <div class="live-pill"><div class="live-dot"></div>Live</div>
    <div class="timer" id="sessionTimer">00:00</div>
    <div class="pcount"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="4" r="2.5"/><path d="M1 12c0-2.5 1.8-4 4-4s4 1.5 4 4"/><circle cx="11" cy="5" r="2"/><path d="M13 12c0-2-1.3-3-2-3"/></svg><span id="pCount">0</span></div>
    <button class="end-btn" onclick="confirmLeave()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2l10 10M12 2L2 12"/></svg>
      <span id="endLabel">Leave</span>
    </button>
  </header>

  <!-- Stage -->
  <main class="stage">
    <video id="screenVid" autoplay playsinline></video>
    <video id="camVid" autoplay muted playsinline></video>
    <div class="rec-badge" id="recBadge"><div class="rec-dot2"></div><span id="recTimer">00:00</span></div>
    <div class="hands-float" id="handsFloat"></div>
    <div class="reactions-float" id="reactionsFloat"></div>
    <div class="stage-ph" id="stagePh">
      <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4" y="10" width="40" height="30" rx="3"/><path d="M20 40l4 8M32 40l-4 8M16 48h24"/><circle cx="50" cy="22" r="5"/><circle cx="50" cy="34" r="5"/></svg>
      <h3 id="stageH">Session is live</h3>
      <p id="stageSub">Waiting for screen share…</p>
    </div>
  </main>

  <!-- Side panel -->
  <aside class="panel">
    <div class="panel-tabs">
      <button class="ptab active" onclick="switchPane('chat',this)" id="tab-chat">
        <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h11a1 1 0 011 1v7a1 1 0 01-1 1H5l-3 2V4a1 1 0 011-1z"/></svg>
        Chat
        <div class="tab-badge" id="chatBadge"></div>
      </button>
      <button class="ptab" onclick="switchPane('parts',this)" id="tab-parts">
        <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="5" r="3"/><path d="M1 13c0-3 1.8-4.5 4-4.5s4 1.5 4 4.5"/><circle cx="11" cy="6" r="2"/><path d="M13 13c0-2-1-3-2-3"/></svg>
        People
      </button>
      <button class="ptab" onclick="switchPane('qa',this)" id="tab-qa">
        <svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7.5" cy="7.5" r="6.5"/><path d="M7.5 10v.5M7.5 5a2 2 0 011.5 3.3c-.4.4-1.5.7-1.5 1.7"/></svg>
        Q&amp;A
        <div class="tab-badge" id="qaBadge"></div>
      </button>
    </div>

    <!-- Chat pane -->
    <div class="pane active" id="pane-chat">
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-compose">
        <textarea class="chat-input" id="chatInput" placeholder="Message everyone…" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='38px';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
        <div class="chat-row">
          <div class="emoji-row">
            <button class="emj" onclick="insertEmoji('👍')">👍</button>
            <button class="emj" onclick="insertEmoji('🔥')">🔥</button>
            <button class="emj" onclick="insertEmoji('❓')">❓</button>
            <button class="emj" onclick="insertEmoji('✅')">✅</button>
            <button class="emj" onclick="insertEmoji('💡')">💡</button>
          </div>
          <button class="send-btn" onclick="sendMsg()">
            <svg viewBox="0 0 14 14" fill="currentColor"><path d="M1 1l12 6L1 13V8.5l8-1.5-8-1.5V1z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Participants pane -->
    <div class="pane" id="pane-parts">
      <div class="parts-list" id="partsList"></div>
    </div>

    <!-- Q&A pane -->
    <div class="pane" id="pane-qa">
      <div class="qa-list" id="qaList"></div>
      <div class="qa-compose">
        <input id="qaInput" placeholder="Ask a question…"/>
        <button class="qa-submit" onclick="submitQ()">Submit question</button>
      </div>
    </div>
  </aside>

  <!-- Controls -->
  <div class="controls">
    <!-- Student controls -->
    <div id="studentCtrl" style="display:flex;align-items:center;gap:8px">
      <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="1" width="6" height="10" rx="3"/><path d="M3 9a6 6 0 0012 0M9 15v2"/></svg>
        Mute
      </button>
      <button class="ctrl-btn" id="handBtn" onclick="toggleHand()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2v8M6 4v6M12 4v6M3 9c0 3.3 2.7 5.5 6 5.5s6-2.2 6-5.5"/></svg>
        Raise Hand
      </button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" onclick="sendReaction('👍')"><span style="font-size:18px">👍</span>Like</button>
      <button class="ctrl-btn" onclick="sendReaction('🔥')"><span style="font-size:18px">🔥</span>Fire</button>
      <button class="ctrl-btn" onclick="sendReaction('❓')"><span style="font-size:18px">❓</span>Question</button>
    </div>

    <!-- Teacher controls -->
    <div class="teacher-ctrl" id="teacherCtrl">
      <button class="ctrl-btn" id="shareBtn" onclick="toggleShare()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="12" height="11" rx="2"/><path d="M5 4V2h8v2"/></svg>
        Share
      </button>
      <button class="ctrl-btn" id="camBtn" onclick="toggleCam()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="4"/><circle cx="9" cy="9" r="7.5"/></svg>
        Camera
      </button>
      <button class="ctrl-btn" id="recBtn" onclick="toggleRec()">
        <svg viewBox="0 0 18 18" fill="currentColor"><circle cx="9" cy="9" r="5"/></svg>
        Record
      </button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn danger" onclick="confirmLeave()">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2l14 14M16 2L2 16"/></svg>
        End
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="toast__msg"></span></div>

<script>
const params    = new URLSearchParams(window.location.search);
const sessionId = params.get('id');

let me = null;
let isTeacher = false;
let sessionData = null;
let participants = [];
let questions = [];
let handRaised = false;
let muted = false;

// Recording / media
let shareStream = null, camStream = null, recorder = null;
let recChunks = [], recSec = 0, recInterval = null;
let sharing = false, camOn = false, recording = false;

// Timers
let sessionSec = 0;
let sessionInterval = null;

// Supabase realtime channel
let channel = null;

/* ── Init ─────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', async () => {
  me = await requireAuth();
  if (!me) return;

  if (!sessionId) { toast('No session ID. Going back…', 'err'); setTimeout(() => history.back(), 2000); return; }

  isTeacher = me.profile.role === 'teacher' || me.profile.role === 'admin';

  // Show correct controls
  if (isTeacher) {
    document.getElementById('teacherCtrl').classList.add('visible');
    document.getElementById('studentCtrl').style.display = 'none';
    document.getElementById('endLabel').textContent = 'End session';
    document.getElementById('stageH').textContent   = 'Share your screen to begin';
    document.getElementById('stageSub').textContent = 'Students are waiting.';
  }

  await loadSession();
  subscribeRealtime();
  logAttendance();

  sessionInterval = setInterval(() => {
    sessionSec++;
    document.getElementById('sessionTimer').textContent =
      String(Math.floor(sessionSec/60)).padStart(2,'0') + ':' + String(sessionSec%60).padStart(2,'0');
  }, 1000);

  toast('Joined session.', 'ok');
});

async function loadSession() {
  const { data, error } = await db
    .from('kic_sessions')
    .select('*, teacher:teacher_id(full_name)')
    .eq('id', sessionId)
    .single();

  if (error || !data) { toast('Session not found.', 'err'); return; }
  sessionData = data;
  document.getElementById('sessionName').textContent = data.title;
  document.title = 'KI Connect — ' + data.title;

  // Add ourselves to participants view
  addParticipant({ id: me.user.id, name: me.profile.full_name || me.user.email, role: me.profile.role });
  if (data.teacher?.full_name && me.user.id !== data.teacher_id) {
    addParticipant({ id: data.teacher_id, name: data.teacher.full_name, role: 'teacher' });
  }
}

/* ── Realtime ─────────────────────────────────────────── */
function subscribeRealtime() {
  try {
    channel = db.channel('session-' + sessionId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kic_messages', filter: `session_id=eq.${sessionId}` }, payload => {
        const m = payload.new;
        if (m.sender_id !== me.user.id) {
          appendMsg({ name: m.sender_name, role: m.role || 'student', text: m.content, time: nowTime() });
          if (!document.getElementById('pane-chat').classList.contains('active')) showUnread('chatBadge');
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'kic_sessions', filter: `id=eq.${sessionId}` }, payload => {
        if (payload.new?.status === 'ended' && !isTeacher) {
          toast('The teacher ended the session.', 'err');
          setTimeout(() => window.location.replace('dashboard.html'), 2500);
        }
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kic_questions', filter: `session_id=eq.${sessionId}` }, payload => {
        if (isTeacher) {
          const q = payload.new;
          addQuestion({ id: q.id, asker: q.asker_name, text: q.question, upvotes: q.upvotes || 0, answered: false });
          showUnread('qaBadge');
        }
      })
      .subscribe();
  } catch(e) { console.error('Realtime subscribe error:', e); }
}

function showUnread(badgeId) {
  const el = document.getElementById(badgeId);
  el.style.display = 'flex';
  el.textContent   = (parseInt(el.textContent) || 0) + 1;
}

/* ── Chat ─────────────────────────────────────────────── */
function appendMsg({ name, role, text, time, system }) {
  const msgs = document.getElementById('chatMsgs');
  if (system) {
    const d = document.createElement('div');
    d.className = 'sys-msg';
    d.textContent = text;
    msgs.appendChild(d);
  } else {
    const av = initials(name);
    const d  = document.createElement('div');
    d.className = 'chat-msg';
    d.innerHTML = `
      <div class="msg-av ${role==='teacher'?'teacher':''}">${av}</div>
      <div class="msg-body">
        <div class="msg-head">
          <span class="msg-name ${role==='teacher'?'teacher':''}">${name}</span>
          <span class="msg-time">${time}</span>
        </div>
        <div class="msg-text">${escHtml(text)}</div>
      </div>`;
    msgs.appendChild(d);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('chatInput');
  const text  = input.value.trim();
  if (!text) return;

  const name = me.profile.full_name || me.user.email.split('@')[0];
  appendMsg({ name, role: me.profile.role, text, time: nowTime() });
  input.value = '';
  input.style.height = '38px';

  try {
    await db.from('kic_messages').insert({
      session_id:  sessionId,
      sender_id:   me.user.id,
      sender_name: name,
      content:     text,
      role:        me.profile.role
    });
  } catch(e) { toast('Message failed to send.', 'err'); }
}

function insertEmoji(e) {
  const input = document.getElementById('chatInput');
  input.value += e;
  input.focus();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Participants ─────────────────────────────────────── */
function addParticipant(p) {
  if (participants.find(x => x.id === p.id)) return;
  participants.push(p);
  renderParts();
  document.getElementById('pCount').textContent = participants.length;
}

function renderParts() {
  const el = document.getElementById('partsList');
  el.innerHTML = participants.map(p => `
    <div class="part-item ${p.hand ? 'raised' : ''}">
      <div class="part-av ${p.role === 'teacher' ? 'teacher' : ''}">${initials(p.name)}</div>
      <div class="part-name">${p.name}${p.id === me?.user.id ? ' (You)' : ''}${p.hand ? ' ✋' : ''}</div>
      <span class="part-role ${p.role}">${p.role}</span>
    </div>`).join('');
}

/* ── Raise hand ───────────────────────────────────────── */
function toggleHand() {
  handRaised = !handRaised;
  const btn = document.getElementById('handBtn');
  btn.classList.toggle('on', handRaised);
  btn.lastChild.textContent = handRaised ? 'Lower' : 'Raise Hand';

  const me_p = participants.find(p => p.id === me.user.id);
  if (me_p) me_p.hand = handRaised;
  renderParts();

  if (handRaised) {
    const chip = document.createElement('div');
    chip.className = 'hand-chip'; chip.id = 'hc-' + me.user.id;
    chip.textContent = '✋ ' + (me.profile.full_name || 'You');
    document.getElementById('handsFloat').appendChild(chip);
    toast('Hand raised. The teacher will call on you.', 'ok');
  } else {
    document.getElementById('hc-' + me.user.id)?.remove();
  }
}

/* ── Reactions ────────────────────────────────────────── */
function sendReaction(emoji) {
  const el = document.createElement('div');
  el.className = 'reaction';
  el.textContent = emoji;
  document.getElementById('reactionsFloat').appendChild(el);
  setTimeout(() => el.remove(), 2500);
  appendMsg({ system: true, text: (me.profile.full_name || 'You') + ' reacted ' + emoji });
}

/* ── Mute ─────────────────────────────────────────────── */
function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('muteBtn');
  btn.classList.toggle('on', muted);
  btn.lastChild.textContent = muted ? 'Unmute' : 'Mute';
  toast(muted ? 'Microphone muted.' : 'Microphone on.', 'ok');
}

/* ── Q&A ──────────────────────────────────────────────── */
function addQuestion(q) {
  questions.push(q);
  renderQA();
}

function renderQA() {
  const el = document.getElementById('qaList');
  if (!questions.length) { el.innerHTML = '<div class="empty-sm">No questions yet.</div>'; return; }
  el.innerHTML = questions.map(q => `
    <div class="qa-item ${q.answered ? 'answered' : ''}">
      <div class="qa-asker">${q.asker}</div>
      <div class="qa-q">${escHtml(q.text)}</div>
      <div class="qa-foot">
        <button class="qa-upvote" onclick="upvoteQ('${q.id}')">▲ ${q.upvotes}</button>
        ${isTeacher ? `<button class="qa-btn ${q.answered ? 'answered' : 'mark'}" onclick="markQ('${q.id}')">${q.answered ? '✓ Answered' : 'Mark answered'}</button>` : ''}
      </div>
    </div>`).join('');
}

async function submitQ() {
  const input = document.getElementById('qaInput');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';

  const name = me.profile.full_name || me.user.email.split('@')[0];

  try {
    const { data, error } = await db.from('kic_questions').insert({
      session_id: sessionId,
      asker_id:   me.user.id,
      asker_name: name,
      question:   text
    }).select().single();

    if (!error && data) {
      addQuestion({ id: data.id, asker: name, text, upvotes: 0, answered: false });
      toast('Question submitted.', 'ok');
    }
  } catch(e) { toast('Failed to submit question.', 'err'); }
}

async function upvoteQ(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  q.upvotes++;
  renderQA();
  await db.from('kic_questions').update({ upvotes: q.upvotes }).eq('id', id);
}

async function markQ(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  q.answered = !q.answered;
  renderQA();
  await db.from('kic_questions').update({ answered: q.answered }).eq('id', id);
}

/* ── Media (teacher) ──────────────────────────────────── */
async function toggleShare() {
  if (!sharing) {
    try {
      shareStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'always' }, audio: true });
      document.getElementById('screenVid').srcObject = shareStream;
      document.getElementById('screenVid').style.display = 'block';
      document.getElementById('stagePh').style.display   = 'none';
      shareStream.getVideoTracks()[0].onended = stopAllMedia;
      sharing = true;
      document.getElementById('shareBtn').classList.add('on');
      document.getElementById('shareBtn').lastChild.textContent = 'Sharing';
      toast('Screen sharing started.', 'ok');
      appendMsg({ system: true, text: 'Screen sharing started.' });
    } catch(e) { if (e.name !== 'NotAllowedError') toast('Could not share screen: ' + e.message, 'err'); }
  } else { stopAllMedia(); }
}

async function toggleCam() {
  if (!camOn) {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      document.getElementById('camVid').srcObject = camStream;
      document.getElementById('camVid').style.display = 'block';
      camOn = true;
      document.getElementById('camBtn').classList.add('on');
      document.getElementById('camBtn').lastChild.textContent = 'Cam on';
    } catch(e) { toast('Camera unavailable.', 'err'); }
  } else {
    camStream?.getTracks().forEach(t => t.stop());
    document.getElementById('camVid').style.display = 'none';
    camOn = false;
    document.getElementById('camBtn').classList.remove('on');
    document.getElementById('camBtn').lastChild.textContent = 'Camera';
  }
}

function toggleRec() {
  if (!sharing) { toast('Share your screen before recording.', 'err'); return; }
  if (!recording) startRec(); else stopRec();
}

function startRec() {
  try {
    recorder = new MediaRecorder(new MediaStream(shareStream.getTracks()), { mimeType: 'video/webm;codecs=vp9' });
    recChunks = []; recSec = 0;
    recorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const a    = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `KI-${sessionId}-${new Date().toISOString().slice(0,10)}.webm` });
      a.click();
      toast('Recording downloaded.', 'ok');
    };
    recorder.start(1000);
    recording = true;
    document.getElementById('recBadge').classList.add('on');
    document.getElementById('recBtn').classList.add('danger');
    document.getElementById('recBtn').lastChild.textContent = 'Stop rec';
    recInterval = setInterval(() => {
      recSec++;
      document.getElementById('recTimer').textContent =
        String(Math.floor(recSec/60)).padStart(2,'0') + ':' + String(recSec%60).padStart(2,'0');
    }, 1000);
    toast('Recording started.', 'ok');
    appendMsg({ system: true, text: 'Recording started.' });
  } catch(e) { toast('Recording failed: ' + e.message, 'err'); }
}

function stopRec() {
  recorder?.stop();
  clearInterval(recInterval);
  recording = false;
  document.getElementById('recBadge').classList.remove('on');
  document.getElementById('recBtn').classList.remove('danger');
  document.getElementById('recBtn').lastChild.textContent = 'Record';
}

function stopAllMedia() {
  stopRec();
  shareStream?.getTracks().forEach(t => t.stop());
  camStream?.getTracks().forEach(t => t.stop());
  document.getElementById('screenVid').style.display = 'none';
  document.getElementById('camVid').style.display    = 'none';
  document.getElementById('stagePh').style.display   = 'block';
  document.getElementById('shareBtn').classList.remove('on');
  document.getElementById('shareBtn').lastChild.textContent = 'Share';
  document.getElementById('camBtn').classList.remove('on');
  document.getElementById('camBtn').lastChild.textContent   = 'Camera';
  sharing = camOn = false;
  appendMsg({ system: true, text: 'Screen sharing stopped.' });
}

/* ── Attendance ───────────────────────────────────────── */
async function logAttendance() {
  try {
    await db.from('kic_attendance').upsert({
      session_id: sessionId,
      user_id:    me.user.id,
      user_name:  me.profile.full_name || me.user.email,
      status:     'present'
    });
  } catch(e) {}
}

/* ── End / leave ──────────────────────────────────────── */
async function confirmLeave() {
  const msg = isTeacher
    ? 'End this session for everyone? Students will be redirected.'
    : 'Leave this session?';

  if (!confirm(msg)) return;

  clearInterval(sessionInterval);
  stopAllMedia();
  channel?.unsubscribe();

  if (isTeacher) {
    try {
      await db.from('kic_sessions').update({ status: 'ended', ended_at: new Date().toISOString() }).eq('id', sessionId);
    } catch(e) {}
  }

  // Log departure
  try {
    await db.from('kic_attendance').update({ left_at: new Date().toISOString(), duration_seconds: sessionSec }).eq('session_id', sessionId).eq('user_id', me.user.id);
  } catch(e) {}

  window.location.replace(isTeacher ? 'teacher.html' : 'dashboard.html');
}

/* ── UI helpers ───────────────────────────────────────── */
function switchPane(id, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.ptab').forEach(t => t.classList.remove('active'));
  document.getElementById('pane-' + id).classList.add('active');
  btn.classList.add('active');
  // Clear badge
  const badge = document.getElementById(id === 'chat' ? 'chatBadge' : id === 'qa' ? 'qaBadge' : '');
  if (badge) { badge.style.display = 'none'; badge.textContent = ''; }
}
